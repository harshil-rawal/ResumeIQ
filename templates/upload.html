<!DOCTYPE html>
<html>

<head>
    <title>ResumeIQ</title>
</head>

<body>

    <h1>ResumeIQ</h1>

    <h2>Upload Resume</h2>

    <form action="/upload" method="POST" enctype="multipart/form-data">

        <input
            type="file"
            name="resume"
            accept=".pdf,.docx"
            required>

        <br><br>

        <button type="submit">
            Upload Resume
        </button>

    </form>

</body>

</html>
