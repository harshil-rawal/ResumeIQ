<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analyze Your Resume | ResumeIQ</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>
    <!-- Background -->
    <div class="background-container">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
        <div class="grid-pattern"></div>
    </div>

    <!-- Navbar -->
    <header class="navbar-container">
        <nav class="navbar">
            <a href="/" class="logo">ResumeIQ</a>
            <ul class="nav-links">
                <li><a href="/">Home</a></li>
                <li><a href="/#features">Features</a></li>
                <li><a href="/#why-ats">Why ATS Matters</a></li>
            </ul>
            <a href="/upload-page" class="nav-btn active">Analyze Resume</a>
        </nav>
    </header>

    <!-- Upload Section -->
    <section class="upload-section">
        <div class="upload-container">
            <div class="upload-header">
                <h1>Analyze Your Resume</h1>
                <p>Upload your resume and job description to get your ATS score and actionable insights</p>
            </div>

            <form action="/upload" method="POST" enctype="multipart/form-data" class="upload-form">
                <!-- Resume Upload -->
                <div class="upload-group">
                    <label for="resume" class="upload-label">Resume</label>
                    <label id="drop-area" for="resume" class="upload-box">
                        <div class="upload-box-content">
                            <div class="upload-icon-wrapper">
                                <svg class="upload-icon" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                                    <polyline points="17 8 12 3 7 8"/>
                                    <line x1="12" y1="3" x2="12" y2="15"/>
                                </svg>
                            </div>
                            <div class="upload-text">
                                <h3>Drag & drop your resume</h3>
                                <p>or <span class="upload-link">click to browse</span></p>
                                <span class="upload-formats">PDF, DOC, DOCX • Max 10MB</span>
                            </div>
                        </div>
                    </label>
                    <input
                        id="resume"
                        type="file"
                        name="resume"
                        accept=".pdf,.doc,.docx"
                        required
                        hidden>

                    <!-- File Preview -->
                    <div id="file-preview" class="file-preview">
                        <div class="file-meta">
                            <div class="file-icon" id="file-icon">📄</div>
                            <div class="file-details">
                                <h4 id="file-name">No file selected</h4>
                                <p id="file-size"></p>
                            </div>
                        </div>
                        <button type="button" id="remove-file" class="remove-file" aria-label="Remove file">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <line x1="18" y1="6" x2="6" y2="18"/>
                                <line x1="6" y1="6" x2="18" y2="18"/>
                            </svg>
                        </button>
                    </div>
                </div>

                <!-- Upload Button -->
                <button type="submit" class="upload-btn" id="upload-btn">
                    <span id="button-text">Analyze Resume</span>
                    <span id="loader" class="loader" aria-hidden="true"></span>
                </button>
            </form>

            <div class="upload-info">
                <div class="info-item">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="12" cy="12" r="10"/>
                        <line x1="12" y1="16" x2="12" y2="12"/>
                        <line x1="12" y1="8" x2="12.01" y2="8"/>
                    </svg>
                    <span>Your resume is analyzed securely and instantly</span>
                </div>
                <div class="info-item">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="12" cy="12" r="10"/>
                        <line x1="12" y1="16" x2="12" y2="12"/>
                        <line x1="12" y1="8" x2="12.01" y2="8"/>
                    </svg>
                    <span>No data is stored after analysis</span>
                </div>
            </div>
        </div>
    </section>

    <script src="{{ url_for('static', filename='script.js') }}"></script>

</body>

</html>
